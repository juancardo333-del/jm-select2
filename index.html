<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JM Select · Gestión</title>
<link rel="icon" href="logo.jpg">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6a65;--bd:#e2e0da;--ac:#1f4e46;--acx:#fff;--ok:#1b7f4b;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#151514;--card:#1f1f1d;--tx:#efeee9;--mu:#9a9890;--bd:#33322e;--ac:#5fb3a2;--acx:#0d1f1b;--ok:#5fd08f;--bad:#f08a82}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px 4px;max-width:1000px;margin:auto}
#hd img{width:52px;height:52px;border-radius:8px}#hd .t{flex:1;min-width:140px}#hd b{font-size:18px}#hd small{display:block;color:var(--mu)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:1000px;margin:auto}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
main{max-width:1000px;margin:auto;padding:8px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto}
.btn{background:var(--ac);color:var(--acx);border:0;padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer}
.btn.l{background:none;color:var(--tx);border:1px solid var(--bd)}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:16px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:680px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-size:12px;color:var(--mu);font-weight:600}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
.kp div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.kp small{color:var(--mu)}.kp b{display:block;font-size:19px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.empty{color:var(--mu);padding:8px 0}
.gate{max-width:400px;margin:24px auto}.gate img{width:140px;border-radius:12px;display:block;margin:0 auto 14px}
.gate .f{display:grid;gap:10px}.gate .sw{display:flex;gap:6px;margin-bottom:12px}.gate .sw button{flex:1}
#er{color:var(--bad);min-height:20px;font-size:13px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);overflow:auto;padding:16px 12px;z-index:20}
.sheet{background:#fff;color:#111;max-width:720px;margin:auto;padding:20px;border-radius:12px}.sheet th,.sheet td{border-color:#ddd}.sheet small{color:#555}
.ih{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid #1f4e46;padding-bottom:8px;margin-bottom:10px}.ih img{width:64px;border-radius:6px}.bar{display:flex;gap:8px;margin-bottom:12px}
@media print{body>:not(#ov){display:none!important}#ov{position:static;background:none;padding:0}.noprint{display:none!important}.sheet{padding:0}}
</style>
</head>
<body>
<div id="hd"></div>
<nav id="nav"></nav>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>window.CFG={url:'https://smvvxianelofqwdrport.supabase.co',key:'sb_publishable_7Q6DQLwV57D7zy_qj-hOng_TzS_-QzB'};</script>
<script>
const M=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=i=>document.getElementById(i),val=i=>$(i).value.trim(),today=()=>new Date().toISOString().slice(0,10);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
let ME=null,ADM=false,NAME='',ALL=false,ST='load',MODE='login',tab='pedidos',D=[],DF=today(),DC='',NP=false;
let C=[],P=[],PR=[],G=[];
const tot=p=>sum(p.items,l=>l.precio*l.cant),cost=p=>sum(p.items,l=>l.costo*l.cant),ut=p=>tot(p)-cost(p),pag=p=>sum(p.pagos,x=>x.m),sal=p=>tot(p)-pag(p);
const prDeuda=pr=>sum(pr.movs.filter(m=>m.tipo==='deuda'),m=>m.monto);
const prAbono=pr=>sum(pr.movs.filter(m=>m.tipo==='abono'),m=>m.monto);
const prSaldo=pr=>prDeuda(pr)-prAbono(pr);
const cn=i=>(C.find(x=>x.id===i)||{}).nombre||'—';
const rl=l=>esc(l.nombre);
const TABS={clientes:'Clientes',pedidos:'Pedidos',pagos:'Pagos',proveedores:'Proveedores',gastos:'Gastos'};
if(!window.CFG||/TU-PROYECTO/.test(CFG.url)){document.body.innerHTML='<p style="padding:20px">Falta configurar <b>config.js</b> con tu URL y clave de Supabase (ver LEEME.md).</p>';throw new Error('config')}
const sb=supabase.createClient(CFG.url,CFG.key);
const MSG={'Invalid login credentials':'Correo o contraseña incorrectos.','User already registered':'Ese correo ya está registrado.','Email not confirmed':'Debes confirmar tu correo antes de entrar.'};
const tr=e=>e.code==='23503'?'No se puede eliminar: tiene registros asociados.':(MSG[e.message]||(/least|weak/i.test(e.message)?'La contraseña es muy débil (mínimo 8 caracteres).':e.message));
async function ok(p){const {data,error}=await p;if(error)throw new Error(tr(error));return data}
async function loadAll(){
 let cq=sb.from('clientes').select('*,perfiles(nombre)').order('nombre'),
     pq=sb.from('pedidos').select('*,perfiles(nombre),pedido_items(*),pagos(*)').order('id'),
     prq=sb.from('proveedores').select('*,perfiles(nombre),proveedor_movimientos(*)').order('nombre'),
     gq=sb.from('gastos').select('*,perfiles(nombre)').order('fecha',{ascending:false}).order('id',{ascending:false});
 if(!ALL){cq=cq.eq('usuario_id',ME);pq=pq.eq('usuario_id',ME);prq=prq.eq('usuario_id',ME);gq=gq.eq('usuario_id',ME)}
 const [c,p,pr,g]=await Promise.all([ok(cq),ok(pq),ok(prq),ok(gq)]);
 C=c.map(x=>({id:String(x.id),nombre:x.nombre,tel:x.telefono,mail:x.correo,ciudad:x.ciudad,u:x.usuario_id,uname:x.perfiles?.nombre||'—'}));
 P=p.map(x=>({id:String(x.id),num:x.numero,fecha:x.fecha,c:String(x.cliente_id),u:x.usuario_id,uname:x.perfiles?.nombre||'—',items:x.pedido_items.slice().sort((a,b)=>a.id-b.id).map(i=>({id:String(i.id),nombre:i.producto||'Producto',cant:i.cantidad,precio:+i.precio,costo:+i.costo})),pagos:x.pagos.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(g=>({f:g.fecha,m:+g.monto,n:g.nota||''}))}));
 PR=pr.map(x=>({id:String(x.id),nombre:x.nombre,tel:x.telefono||'',mail:x.correo||'',ciudad:x.ciudad||'',u:x.usuario_id,uname:x.perfiles?.nombre||'—',movs:(x.proveedor_movimientos||[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.id-a.id).map(m=>({id:String(m.id),tipo:m.tipo,fecha:m.fecha,monto:+m.monto,nota:m.nota||''}))}));
 G=g.map(x=>({id:String(x.id),fecha:x.fecha,concepto:x.concepto,cat:x.categoria||'',monto:+x.monto,nota:x.nota||'',u:x.usuario_id,uname:x.perfiles?.nombre||'—'}));
 draw()}
async function act(f){try{await f();await loadAll()}catch(e){alert(e.message)}}
function go(t){tab=t;draw()}
function draw(){
 const ok=ST==='ok';
 $('hd').innerHTML=`<img src="logo.jpg" alt="JM Select"><div class="t"><b>JM Select</b>${ok?`<small>${esc(NAME)}${ADM?' · administrador':''}</small>`:''}</div>${ok&&ADM?`<label style="margin:0"><input type="checkbox" ${ALL?'checked':''} onchange="ALL=this.checked;loadAll()"> Ver todo el equipo</label>`:''}${ok?'<button class="btn l" onclick="logout()">Salir</button>':''}`;
 if(!ok){$('nav').innerHTML='';$('app').innerHTML=gate();return}
 $('nav').innerHTML=Object.entries(TABS).map(([k,n])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
 $('app').innerHTML=({clientes:vC,pedidos:vP,pagos:vG,proveedores:vPR,gastos:vGS})[tab]();
 if($('pc'))deuda();
}
/* Registro e inicio de sesión */
function gate(){
 if(ST==='load')return '<div class="card gate">Cargando…</div>';
 const reg=MODE==='reg',k='onkeydown="if(event.key===\'Enter\')doAuth()"';
 return `<div class="card gate"><img src="logo.jpg" alt="">
<div class="sw"><button class="btn ${reg?'l':''}" onclick="MODE='login';draw()">Iniciar sesión</button><button class="btn ${reg?'':'l'}" onclick="MODE='reg';draw()">Crear cuenta</button></div>
<div class="f">${reg?`<div><label>Nombre</label><input id="an" ${k}></div>`:''}
<div><label>Correo</label><input id="ae" type="email" autocomplete="email" ${k}></div>
<div><label>Contraseña${reg?' (mínimo 8 caracteres)':''}</label><input id="ap" type="password" autocomplete="${reg?'new-password':'current-password'}" ${k}></div>
${reg?`<div><label>Repite la contraseña</label><input id="ap2" type="password" autocomplete="new-password" ${k}></div>`:''}
<div id="er"></div><button class="btn" onclick="doAuth()">${reg?'Crear mi cuenta':'Entrar'}</button></div></div>`}
async function enter(u){ME=u.id;const pf=await ok(sb.from('perfiles').select('nombre,rol').eq('id',ME).single());NAME=pf.nombre;ADM=pf.rol==='admin';ST='ok';await loadAll()}
async function doAuth(){
 $('er').textContent='';$('er').style.color='';
 try{const email=val('ae'),password=$('ap').value,reg=MODE==='reg';
  if(reg){const nombre=val('an');if(!nombre)throw new Error('Escribe tu nombre.');if(password.length<8)throw new Error('La contraseña debe tener al menos 8 caracteres.');if(password!==$('ap2').value)throw new Error('Las contraseñas no coinciden.');
   const {data,error}=await sb.auth.signUp({email,password,options:{data:{nombre}}});if(error)throw new Error(tr(error));
   if(!data.session){$('er').style.color='var(--ok)';$('er').textContent='Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.';return}
   await enter(data.user)}
  else{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw new Error(tr(error));await enter(data.user)}}
 catch(e){$('er').textContent=e.message}}
async function logout(){await sb.auth.signOut();ST='auth';ME=null;ALL=false;C=[];P=[];PR=[];G=[];D=[];NP=false;draw()}
/* Clientes */
function vC(){return `<div class="card"><h2>Nuevo cliente</h2><div class="grid">
<div><label>Nombre</label><input id="cn"></div><div><label>Teléfono</label><input id="ct"></div>
<div><label>Correo</label><input id="ce"></div><div><label>Ciudad</label><input id="cc"></div>
<button class="btn" onclick="addC()">Agregar</button></div></div>
<div class="card"><h2>${ALL?'Clientes del equipo':'Mis clientes'} (${C.length})</h2><div class="tw">${C.length?`<table><tr><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Ciudad</th>${ALL?'<th>Responsable</th>':''}<th>Pedidos</th><th>Debe</th><th></th></tr>`+C.map(c=>{const ps=P.filter(p=>p.c===c.id),d=sum(ps,sal);return `<tr><td>${esc(c.nombre)}</td><td>${esc(c.tel)}</td><td>${esc(c.mail)}</td><td>${esc(c.ciudad)}</td>${ALL?`<td>${esc(c.uname)}</td>`:''}<td>${ps.length}</td><td class="${d>0?'neg':'pos'}">${M(d)}</td><td style="white-space:nowrap"><button class="x" style="color:var(--tx)" title="Editar" onclick="editC('${c.id}')">✎</button>${ADM?`<button class="x" title="Eliminar" onclick="del('clientes','${c.id}')">✕</button>`:''}</td></tr>`}).join('')+'</table>':'<div class="empty">Aún no tienes clientes registrados.</div>'}</div></div>`}
function addC(){const n=val('cn');if(!n)return;act(()=>ok(sb.from('clientes').insert({nombre:n,telefono:val('ct'),correo:val('ce'),ciudad:val('cc')})))}
/* Pedidos */
function vP(){
 const v=sum(P,tot),k=sum(P,cost),u=v-k,dt=sum(D,l=>l.precio*l.cant),du=sum(D,l=>(l.precio-l.costo)*l.cant);
 const form=!C.length?'<div class="empty">Primero registra al menos un cliente tuyo.</div>':NP?`<div class="grid">
<div><label>Fecha del pedido</label><input id="pf" type="date" value="${DF}"></div>
<div><label>Cliente</label><select id="pc" onchange="deuda()">${C.map(c=>`<option value="${c.id}" ${c.id===DC?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select><div id="deuda" style="margin-top:4px;font-size:13px"></div></div></div>
<h2 style="margin-top:14px">Productos del pedido</h2><div class="grid">
<div><label>Producto</label><input id="pn2" placeholder="Ej: Zapatos Nike"></div>
<div><label>Cantidad</label><input id="pq" type="number" min="1" value="1"></div>
<div><label>Costo (lo que te cuesta)</label><input id="pk" type="number" min="0" placeholder="250000"></div>
<div><label>Precio de venta</label><input id="pp" type="number" min="0" placeholder="300000"></div>
<button class="btn" onclick="addLine()">+ Agregar producto</button></div>
${D.length?`<div class="tw"><table style="min-width:520px"><tr><th>Producto</th><th>Cant.</th><th>Costo</th><th>Precio</th><th>Utilidad</th><th></th></tr>${D.map((l,i)=>`<tr><td>${rl(l)}</td><td>${l.cant}</td><td>${M(l.costo)}</td><td>${M(l.precio)}</td><td class="${l.precio>=l.costo?'pos':'neg'}">${M((l.precio-l.costo)*l.cant)}</td><td><button class="x" onclick="D.splice(${i},1);keep();draw()">✕</button></td></tr>`).join('')}<tr><td colspan="3"><b>Total a cobrar</b></td><td><b>${M(dt)}</b></td><td class="${du>=0?'pos':'neg'}"><b>${M(du)}</b></td><td></td></tr></table></div>`:'<div class="empty">Agrega uno o más productos al pedido.</div>'}
<div class="grid" style="margin-top:10px"><div><label>Abono inicial (opcional)</label><input id="pa" type="number" min="0" value="0"></div><button class="btn" onclick="addP()">Registrar pedido y factura</button><button class="btn l" onclick="NP=false;D=[];draw()">Cancelar</button></div>`:'<button class="btn" onclick="NP=true;draw()">+ Agregar nuevo pedido</button>';
 return `<div class="kp"><div><small>Ventas</small><b>${M(v)}</b></div><div><small>Costos</small><b>${M(k)}</b></div><div><small>Utilidad</small><b class="${u>=0?'pos':'neg'}">${M(u)}</b></div><div><small>Margen</small><b>${v?Math.round(u/v*100):0}%</b></div></div>
<div class="card"><h2>Nuevo pedido</h2>${form}</div>
<div class="card"><h2>Pedidos (${P.length})</h2><div class="tw">${P.length?`<table style="min-width:900px"><tr><th>Fecha</th><th>Cliente</th>${ALL?'<th>Responsable</th>':''}<th>Productos</th><th>Total</th><th>Pagado</th><th>Saldo</th><th>Utilidad</th><th>Factura</th><th></th></tr>`+P.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.num.localeCompare(a.num)).map(p=>`<tr><td>${p.fecha}</td><td>${esc(cn(p.c))}</td>${ALL?`<td>${esc(p.uname)}</td>`:''}<td style="white-space:normal;min-width:160px">${p.items.map(rl).join(', ')}</td><td>${M(tot(p))}</td><td>${M(pag(p))}</td><td class="${sal(p)>0?'neg':'pos'}">${M(sal(p))}</td><td class="${ut(p)>=0?'pos':'neg'}">${M(ut(p))}</td><td><button class="btn" style="padding:4px 10px" onclick="inv('${p.id}')">${p.num}</button></td><td style="white-space:nowrap"><button class="x" style="color:var(--tx)" title="Editar precios" onclick="editP('${p.id}')">✎</button><button class="x" title="Eliminar" onclick="del('pedidos','${p.id}')">✕</button></td></tr>`).join('')+'</table>':'<div class="empty">Aún no hay pedidos.</div>'}</div></div>`}
function deuda(){const d=sum(P.filter(p=>p.c===val('pc')),sal);$('deuda').innerHTML=d>0?`Este cliente debe: <b class="neg">${M(d)}</b>`:'<span class="pos">Este cliente está al día</span>'}
function keep(){if($('pf')){DF=val('pf');DC=val('pc')}}
function addLine(){keep();const n=val('pn2');if(!n){alert('Escribe el nombre del producto.');return}D.push({nombre:n,cant:+val('pq')||1,precio:+val('pp')||0,costo:+val('pk')||0});draw()}
async function addP(){
 if(!D.length){alert('Agrega al menos un producto al pedido.');return}
 const t=sum(D,l=>l.precio*l.cant),a=+val('pa')||0;
 if(a>t){alert('El abono no puede ser mayor al total del pedido.');return}
 try{const id=await ok(sb.rpc('crear_pedido',{p_fecha:val('pf')||today(),p_cliente:+val('pc'),p_items:D,p_abono:a}));
  D=[];DC='';DF=today();NP=false;await loadAll();inv(String(id))}catch(e){alert(e.message)}}
function editP(id){
 const p=P.find(x=>x.id===id);if(!p)return;
 const old=$('ov');if(old)old.remove();const o=document.createElement('div');o.id='ov';
 o.innerHTML=`<div class="sheet" style="max-width:620px">
  <h2 style="margin:0 0 4px">Editar precios · ${p.num}</h2>
  <small>Cliente: ${esc(cn(p.c))} · Abonado: ${M(pag(p))}</small>
  <div class="tw" style="margin-top:12px">
   <table style="min-width:480px">
    <tr><th>Producto</th><th>Cant.</th><th>Costo</th><th>Precio venta</th></tr>
    ${p.items.map(l=>`<tr>
     <td>${rl(l)}</td>
     <td style="width:75px"><input id="ep_q_${l.id}" type="number" min="1" value="${l.cant}" style="background:#fff;color:#111;border-color:#ccc"></td>
     <td style="width:130px"><input id="ep_k_${l.id}" type="number" min="0" value="${l.costo}" style="background:#fff;color:#111;border-color:#ccc"></td>
     <td style="width:130px"><input id="ep_p_${l.id}" type="number" min="0" value="${l.precio}" style="background:#fff;color:#111;border-color:#ccc"></td>
    </tr>`).join('')}
   </table>
  </div>
  <div id="eer" style="color:#b3261e;min-height:20px;margin-top:8px;font-size:13px"></div>
  <div class="bar" style="margin-top:6px">
   <button class="btn" id="epsv">Guardar cambios</button>
   <button class="btn" style="background:none;color:#111;border:1px solid #ccc" onclick="$('ov').remove()">Cancelar</button>
  </div>
 </div>`;
 document.body.appendChild(o);
 $('epsv').onclick=async()=>{
  try{
   const updates=p.items.map(l=>{
    const cant=Math.max(1,+$('ep_q_'+l.id).value||1);
    const costo=Math.max(0,+$('ep_k_'+l.id).value||0);
    const precio=Math.max(0,+$('ep_p_'+l.id).value||0);
    return {id:l.id,cant,costo,precio};
   });
   const nuevoTotal=sum(updates,u=>u.precio*u.cant);
   if(nuevoTotal<pag(p))throw new Error('El nuevo total ('+M(nuevoTotal)+') no puede ser menor a lo ya abonado ('+M(pag(p))+').');
   for(const u of updates){
    const r=await ok(sb.from('pedido_items').update({cantidad:u.cant,costo:u.costo,precio:u.precio}).eq('id',u.id).select());
    if(!r.length)throw new Error('No se pudo actualizar. Verifica los permisos en Supabase.');
   }
   o.remove();
   await loadAll();
  }catch(e){$('eer').textContent=e.message}
 };
}
/* Pagos */
function vG(){
 const deb=P.filter(p=>sal(p)>0),ac=C.filter(c=>P.some(p=>p.c===c.id));
 return `<div class="kp"><div><small>Cobrado</small><b class="pos">${M(sum(P,pag))}</b></div><div><small>Por cobrar</small><b class="${sum(P,sal)>0?'neg':'pos'}">${M(sum(P,sal))}</b></div><div><small>Pedidos con saldo</small><b>${deb.length}</b></div></div>
<div class="card"><h2>Registrar abono</h2>${deb.length?`<div class="grid">
<div><label>Pedido</label><select id="ps" onchange="$('pm').value=sal(P.find(x=>x.id===val('ps')))">${deb.map(p=>`<option value="${p.id}">${p.num} · ${esc(cn(p.c))} · debe ${M(sal(p))}</option>`).join('')}</select></div>
<div><label>Valor del abono</label><input id="pm" type="number" min="1" value="${sal(deb[0])}"></div>
<div><label>Fecha</label><input id="pg" type="date" value="${today()}"></div>
<div><label>Nota (opcional)</label><input id="pn"></div>
<button class="btn" onclick="addPago()">Registrar abono</button></div>`:'<div class="empty">No hay pedidos con saldo pendiente.</div>'}</div>
<div class="card"><h2>Deuda por cliente</h2><div class="tw">${ac.length?`<table style="min-width:520px"><tr><th>Cliente</th><th>Total pedidos</th><th>Abonado</th><th>Debe</th></tr>`+ac.map(c=>{const ps=P.filter(p=>p.c===c.id),d=sum(ps,sal);return `<tr><td>${esc(c.nombre)}</td><td>${M(sum(ps,tot))}</td><td>${M(sum(ps,pag))}</td><td class="${d>0?'neg':'pos'}"><b>${M(d)}</b></td></tr>`}).join('')+'</table>':'<div class="empty">Aún no hay pedidos.</div>'}</div></div>`}
function addPago(){const p=P.find(x=>x.id===val('ps')),m=+val('pm');if(!p||!(m>0))return;if(m>sal(p)){alert('El abono supera el saldo del pedido ('+M(sal(p))+').');return}act(()=>ok(sb.rpc('registrar_abono',{p_pedido:+p.id,p_fecha:val('pg')||today(),p_monto:m,p_nota:val('pn')})))}
/* Gastos */
function vGS(){
 const tt=sum(G,g=>g.monto),mes=today().slice(0,7),tm=sum(G.filter(g=>g.fecha.startsWith(mes)),g=>g.monto);
 const cats=[...new Set(G.map(g=>g.cat).filter(Boolean))];
 return `<div class="kp"><div><small>Total gastado</small><b class="neg">${M(tt)}</b></div><div><small>Este mes</small><b>${M(tm)}</b></div><div><small>Gastos registrados</small><b>${G.length}</b></div></div>
<div class="card"><h2>Nuevo gasto</h2><div class="grid">
<div><label>Fecha</label><input id="gf" type="date" value="${today()}"></div>
<div><label>Concepto</label><input id="gc" placeholder="Ej: Transporte"></div>
<div><label>Categoría (opcional)</label><input id="gk" list="gcats" placeholder="Ej: Envíos"><datalist id="gcats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
<div><label>Valor</label><input id="gm" type="number" min="1" placeholder="50000"></div>
<div><label>Nota (opcional)</label><input id="gn"></div>
<button class="btn" onclick="addGS()">Agregar gasto</button></div></div>
<div class="card"><h2>${ALL?'Gastos del equipo':'Mis gastos'} (${G.length})</h2><div class="tw">${G.length?`<table style="min-width:640px"><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th>${ALL?'<th>Responsable</th>':''}<th>Valor</th><th>Nota</th><th></th></tr>`+G.map(g=>`<tr><td>${g.fecha}</td><td>${esc(g.concepto)}</td><td>${esc(g.cat)}</td>${ALL?`<td>${esc(g.uname)}</td>`:''}<td class="neg"><b>${M(g.monto)}</b></td><td style="white-space:normal">${esc(g.nota)}</td><td style="white-space:nowrap"><button class="x" style="color:var(--tx)" title="Editar" onclick="editGS('${g.id}')">✎</button><button class="x" title="Eliminar" onclick="del('gastos','${g.id}')">✕</button></td></tr>`).join('')+`<tr><td colspan="${ALL?4:3}"><b>Total</b></td><td class="neg"><b>${M(tt)}</b></td><td colspan="2"></td></tr></table>`:'<div class="empty">Aún no has registrado gastos.</div>'}</div></div>`}
function addGS(){
 const c=val('gc'),m=+val('gm');
 if(!c){alert('Escribe el concepto del gasto.');return}
 if(!(m>0)){alert('Escribe un valor mayor a cero.');return}
 act(()=>ok(sb.from('gastos').insert({fecha:val('gf')||today(),concepto:c,categoria:val('gk'),monto:m,nota:val('gn')})))}
function editGS(id){
 const g=G.find(x=>x.id===id);if(!g)return;
 edit('Editar gasto',[{k:'fecha',l:'Fecha',v:g.fecha,t:'date'},{k:'concepto',l:'Concepto',v:g.concepto},{k:'cat',l:'Categoría',v:g.cat},{k:'monto',l:'Valor',v:g.monto,t:'number'},{k:'nota',l:'Nota',v:g.nota}],async v=>{
  if(!v.concepto)throw new Error('Falta el concepto.');
  if(!(v.monto>0))throw new Error('El valor debe ser mayor a cero.');
  const r=await ok(sb.from('gastos').update({fecha:v.fecha||today(),concepto:v.concepto,categoria:v.cat,monto:v.monto,nota:v.nota}).eq('id',id).select());
  if(!r.length)throw new Error('No se pudo guardar. Revisa que tengas permiso.')})}
/* Proveedores */
function vPR(){
 const totD=sum(PR,prDeuda),totA=sum(PR,prAbono),totS=totD-totA;
 return `<div class="kp">
  <div><small>Total facturado / fiado</small><b>${M(totD)}</b></div>
  <div><small>Total abonado</small><b class="pos">${M(totA)}</b></div>
  <div><small>Saldo que debes</small><b class="${totS>0?'neg':'pos'}">${M(totS)}</b></div>
 </div>
 <div class="card"><h2>Registrar deuda o abono a proveedor</h2>${PR.length?`<div class="grid">
  <div><label>Proveedor</label><select id="prs">${PR.map(pr=>`<option value="${pr.id}">${esc(pr.nombre)} · debes ${M(prSaldo(pr))}</option>`).join('')}</select></div>
  <div><label>Movimiento</label><select id="prt"><option value="deuda">Agregar deuda (+)</option><option value="abono">Registrar abono (-)</option></select></div>
  <div><label>Monto</label><input id="prm" type="number" min="1" placeholder="250000"></div>
  <div><label>Fecha</label><input id="prf" type="date" value="${today()}"></div>
  <div><label>Nota / Concepto</label><input id="prn" placeholder="Ej: Factura #104 o Transferencia"></div>
  <button class="btn" onclick="addPrMov()">Guardar movimiento</button>
 </div>`:'<div class="empty">Primero agrega un proveedor abajo para poder registrar deudas o abonos.</div>'}</div>
 <div class="card"><h2>Nuevo proveedor</h2><div class="grid">
  <div><label>Nombre</label><input id="pr_n"></div>
  <div><label>Teléfono</label><input id="pr_t"></div>
  <div><label>Correo</label><input id="pr_e"></div>
  <div><label>Ciudad</label><input id="pr_c"></div>
  <div><label>Deuda inicial (opcional)</label><input id="pr_d" type="number" min="0" value="0"></div>
  <button class="btn" onclick="addPR()">Agregar proveedor</button>
 </div></div>
 <div class="card"><h2>${ALL?'Proveedores del equipo':'Mis proveedores'} (${PR.length})</h2><div class="tw">${PR.length?`<table style="min-width:860px"><tr><th>Proveedor</th><th>Teléfono</th><th>Ciudad</th>${ALL?'<th>Responsable</th>':''}<th>Total deuda</th><th>Abonado</th><th>Saldo pendiente</th><th>Historial</th><th></th></tr>`+PR.map(pr=>{const d=prDeuda(pr),a=prAbono(pr),s=prSaldo(pr);return `<tr><td>${esc(pr.nombre)}</td><td>${esc(pr.tel)}</td><td>${esc(pr.ciudad)}</td>${ALL?`<td>${esc(pr.uname)}</td>`:''}<td>${M(d)}</td><td class="pos">${M(a)}</td><td class="${s>0?'neg':'pos'}"><b>${M(s)}</b></td><td><button class="btn l" style="padding:4px 10px" onclick="histPR('${pr.id}')">Ver (${pr.movs.length})</button></td><td style="white-space:nowrap"><button class="x" style="color:var(--tx)" title="Editar" onclick="editPR('${pr.id}')">✎</button><button class="x" title="Eliminar" onclick="del('proveedores','${pr.id}')">✕</button></td></tr>`}).join('')+'</table>':'<div class="empty">Aún no tienes proveedores registrados.</div>'}</div></div>`;
}
async function addPR(){
 const n=val('pr_n'),d=+val('pr_d')||0;
 if(!n)return;
 act(async()=>{
  const ins=await ok(sb.from('proveedores').insert({nombre:n,telefono:val('pr_t'),correo:val('pr_e'),ciudad:val('pr_c')}).select().single());
  if(d>0)await ok(sb.from('proveedor_movimientos').insert({proveedor_id:ins.id,tipo:'deuda',fecha:today(),monto:d,nota:'Saldo inicial'}));
 });
}
function addPrMov(){
 const pr=PR.find(x=>x.id===val('prs')),tipo=val('prt'),m=+val('prm');
 if(!pr||!(m>0)){alert('Ingresa un monto válido.');return}
 if(tipo==='abono'&&m>prSaldo(pr)){alert('El abono ('+M(m)+') supera la deuda actual con este proveedor ('+M(prSaldo(pr))+').');return}
 act(()=>ok(sb.from('proveedor_movimientos').insert({proveedor_id:+pr.id,tipo,fecha:val('prf')||today(),monto:m,nota:val('prn')})));
}
function editPR(id){
 const pr=PR.find(x=>x.id===id);if(!pr)return;
 edit('Editar proveedor',[
  {k:'nombre',l:'Nombre',v:pr.nombre},
  {k:'tel',l:'Teléfono',v:pr.tel},
  {k:'mail',l:'Correo',v:pr.mail},
  {k:'ciudad',l:'Ciudad',v:pr.ciudad}
 ],async v=>{
  if(!v.nombre)throw new Error('Falta el nombre.');
  const r=await ok(sb.from('proveedores').update({nombre:v.nombre,telefono:v.tel,correo:v.mail,ciudad:v.ciudad}).eq('id',id).select());
  if(!r.length)throw new Error('No se pudo guardar. Revisa que tengas permiso.');
 });
}
function histPR(id){
 const pr=PR.find(x=>x.id===id);if(!pr)return;
 const old=$('ov');if(old)old.remove();const o=document.createElement('div');o.id='ov';
 o.innerHTML=`<div class="sheet"><div class="bar"><button class="btn" onclick="$('ov').remove()">Cerrar</button></div>
  <h2 style="margin:0 0 4px">Historial · ${esc(pr.nombre)}</h2>
  <small>Deuda total: ${M(prDeuda(pr))} · Abonado: ${M(prAbono(pr))} · <b>Saldo pendiente: ${M(prSaldo(pr))}</b></small>
  <div class="tw" style="margin-top:12px">${pr.movs.length?`<table style="min-width:480px"><tr><th>Fecha</th><th>Tipo</th><th>Nota</th><th>Monto</th><th></th></tr>${pr.movs.map(m=>`<tr><td>${m.fecha}</td><td>${m.tipo==='deuda'?'Deuda (+)':'Abono (-)'}</td><td>${esc(m.nota||'—')}</td><td class="${m.tipo==='deuda'?'neg':'pos'}"><b>${M(m.monto)}</b></td><td><button class="x" title="Eliminar movimiento" onclick="delMov('${m.id}','${pr.id}')">✕</button></td></tr>`).join('')}</table>`:'<div class="empty">Sin movimientos registrados.</div>'}</div>
 </div>`;
 document.body.appendChild(o);
}
async function delMov(mid,pid){
 if(!confirm('¿Eliminar este movimiento?'))return;
 try{
  const r=await ok(sb.from('proveedor_movimientos').delete().eq('id',mid).select());
  if(!r.length)throw new Error('No se pudo eliminar.');
  await loadAll();
  histPR(pid);
 }catch(e){alert(e.message)}
}
function del(c,id){
 const m='¿Eliminar este registro?';
 if(confirm(m))act(async()=>{const r=await ok(sb.from(c).delete().eq('id',id).select());if(!r.length)throw new Error('No se pudo eliminar. Revisa que tengas permiso.')})}
function edit(title,fields,save){
 const old=$('ov');if(old)old.remove();const o=document.createElement('div');o.id='ov';
 o.innerHTML=`<div class="sheet" style="max-width:460px"><h2>${title}</h2><div style="display:grid;gap:10px">${fields.map(f=>`<div><label>${f.l}</label><input id="e_${f.k}" type="${f.t||'text'}" value="${esc(f.v)}"></div>`).join('')}</div><div id="eer" style="color:#b3261e;min-height:20px;margin-top:8px;font-size:13px"></div><div class="bar" style="margin-top:6px"><button class="btn" id="esv">Guardar</button><button class="btn" style="background:none;color:#111;border:1px solid #ccc" onclick="$('ov').remove()">Cancelar</button></div></div>`;
 document.body.appendChild(o);
 $('esv').onclick=async()=>{const v={};fields.forEach(f=>v[f.k]=f.t==='number'?(+$('e_'+f.k).value||0):$('e_'+f.k).value.trim());
  try{await save(v);o.remove();await loadAll()}catch(e){$('eer').textContent=e.message}}}
function editC(id){const c=C.find(x=>x.id===id);if(!c)return;
 edit('Editar cliente',[{k:'nombre',l:'Nombre',v:c.nombre},{k:'tel',l:'Teléfono',v:c.tel},{k:'mail',l:'Correo',v:c.mail},{k:'ciudad',l:'Ciudad',v:c.ciudad}],async v=>{
  if(!v.nombre)throw new Error('Falta el nombre.');
  const r=await ok(sb.from('clientes').update({nombre:v.nombre,telefono:v.tel,correo:v.mail,ciudad:v.ciudad}).eq('id',id).select());
  if(!r.length)throw new Error('No se pudo guardar. Revisa que tengas permiso.')})}
/* Factura */
function inv(id){const p=P.find(x=>x.id===id);if(!p)return;const c=C.find(x=>x.id===p.c)||{};
const old=$('ov');if(old)old.remove();const o=document.createElement('div');o.id='ov';
o.innerHTML=`<div class="sheet"><div class="bar noprint"><button class="btn" onclick="window.print()">Imprimir / PDF</button><button class="btn" onclick="$('ov').remove()">Cerrar</button></div>
<div class="ih"><div style="display:flex;align-items:center;gap:10px"><img src="logo.jpg" alt=""><div><h2 style="margin:0">JM Select</h2><small>Factura de venta</small></div></div><div style="text-align:right"><b>${p.num}</b><br><small>Fecha: ${p.fecha}</small><br><small>Atendió: ${esc(p.uname)}</small></div></div>
<p><b>Cliente:</b> ${esc(c.nombre||'—')}<br>${esc(c.tel||'')} ${esc(c.mail||'')}<br>${esc(c.ciudad||'')}</p>
<div class="tw"><table style="min-width:480px"><tr><th>Producto</th><th>Cant.</th><th>Precio unit.</th><th>Subtotal</th></tr>${p.items.map(l=>`<tr><td>${rl(l)}</td><td>${l.cant}</td><td>${M(l.precio)}</td><td>${M(l.precio*l.cant)}</td></tr>`).join('')}</table></div>
<div style="text-align:right;margin-top:12px"><h2>Total: ${M(tot(p))}</h2>Abonado: ${M(pag(p))}<br><b>Saldo pendiente: ${M(sal(p))}</b></div></div>`;
document.body.appendChild(o)}
/* Inicio */
(async()=>{try{const {data}=await sb.auth.getSession();if(data.session)await enter(data.session.user);else{ST='auth';draw()}}catch(e){ST='auth';draw()}})();
draw();
</script>
</body>
</html>
